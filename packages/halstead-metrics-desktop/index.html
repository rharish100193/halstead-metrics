<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Halstead Metrics</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="app">
		<aside class="browser">
			<div class="browser-head">
				<div class="brand">
					<span class="mark" aria-hidden="true">H</span>
					<div>
						<div class="brand-name">Halstead</div>
						<div class="brand-sub">Metrics</div>
					</div>
				</div>
			</div>
			<div class="browser-bar">
				<button id="up" class="icon-button" type="button" aria-label="Up" title="Parent folder">
					<span class="up-mark" aria-hidden="true"></span>
				</button>
				<div id="cwd" class="cwd" title=""></div>
			</div>
			<div class="tree-label">Files</div>
			<div id="tree" class="tree" role="tree"></div>
		</aside>
		<main class="workspace">
			<section class="panel metrics">
				<div class="panel-head">
					<div>
						<h2>Measures</h2>
						<p class="lede">Operators, operands, and the derived Halstead values for the open file.</p>
					</div>
					<div class="actions">
						<button id="export-html" class="button" type="button" disabled>HTML report</button>
						<button id="export-pdf" class="button button-primary" type="button" disabled>PDF report</button>
					</div>
				</div>
				<div class="fields">
					<div class="stat stat-name">
						<label for="name">File</label>
						<input id="name" type="text" readonly placeholder="No file open">
					</div>
					<div class="stat">
						<label for="program-length">Program length</label>
						<input id="program-length" type="text" readonly>
					</div>
					<div class="stat">
						<label for="program-vocabulary">Vocabulary</label>
						<input id="program-vocabulary" type="text" readonly>
					</div>
					<div class="stat">
						<label for="volume">Volume</label>
						<input id="volume" type="text" readonly>
					</div>
					<div class="stat">
						<label for="difficulty">Difficulty</label>
						<input id="difficulty" type="text" readonly>
					</div>
					<div class="stat">
						<label for="estimated-length">Estimated length</label>
						<input id="estimated-length" type="text" readonly>
					</div>
					<div class="stat">
						<label for="purity-ratio">Purity ratio</label>
						<input id="purity-ratio" type="text" readonly>
					</div>
					<div class="stat">
						<label for="program-effort">Effort</label>
						<input id="program-effort" type="text" readonly>
					</div>
					<div class="stat">
						<label for="programming-time">Time</label>
						<input id="programming-time" type="text" readonly>
					</div>
				</div>
				<p id="status" class="status" role="status"></p>
			</section>
			<section class="panel source">
				<div class="panel-head">
					<h2>Source</h2>
				</div>
				<div id="code" class="code"></div>
			</section>
		</main>
	</div>
	<script src="renderer.js"></script>
</body>
</html>
